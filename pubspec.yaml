name: identidaddigital
description: Identidad Digital.
version: 1.0.15+44

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Biometric local authentication
  local_auth: ^2.1.8

  # Accelerometer and gyroscope sensors
  sensors_plus: ^4.0.2

  # Picking images from the image library
  image_picker: ^1.0.7

  # Cache network image
  cached_network_image: ^3.3.1

  # QR code rendering
  qr_flutter: ^4.1.0

  # Barcode rendering
  barcode_widget: ^2.0.4

  # Device information
  device_info_plus: ^10.1.0

  # HTTP requests
  http: ^1.2.1

  # State management
  provider: ^6.1.2
  rxdart: ^0.27.7

  # Local storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Launch URL
  url_launcher: ^6.2.5

  # Checks for an internet connection
  connectivity_plus: ^5.0.2

  # Firebase - Actualizadas para compatibilidad
  firebase_core: ^2.31.1
  firebase_database: ^10.5.6
  firebase_messaging: ^14.9.4
  firebase_analytics: ^10.10.6

  # Service locator
  get_it: ^7.7.0
  injectable: ^2.4.2

  # Functional programming
  dartz: ^0.10.1

  # Equality comparisons
  equatable: ^2.0.5

  # Date/number formatting
  intl: ^0.18.1

  # App package information
  package_info_plus: ^8.0.0

  # Multipart media types
  mime: ^1.0.4

  # Fix exif rotation
  flutter_exif_rotation: ^0.5.1
  flutter_linkify: ^6.0.0
  store_redirect: ^2.0.1
  screen_brightness: ^0.2.2+1
  flutter_windowmanager: ^0.2.0
  # screenshot_callback: ^3.0.0

  # Permission handler - ACTUALIZACIÓN CRÍTICA para API 35
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.9
  injectable_generator: ^2.6.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - config/
    - lang/

  fonts:
    - family: MyIcons
      fonts:
        - asset: fonts/MyIcons.ttf

    - family: Raleway
      fonts:
        - asset: fonts/Raleway-Black.ttf
          weight: 900
        - asset: fonts/Raleway-BlackItalic.ttf
          weight: 900
          style: italic

        - asset: fonts/Raleway-ExtraBold.ttf
          weight: 800
        - asset: fonts/Raleway-ExtraBoldItalic.ttf
          weight: 800
          style: italic

        - asset: fonts/Raleway-Bold.ttf
          weight: 700
        - asset: fonts/Raleway-BoldItalic.ttf
          weight: 700
          style: italic

        - asset: fonts/Raleway-ExtraLight.ttf
          weight: 200
        - asset: fonts/Raleway-ExtraLightItalic.ttf
          weight: 200
          style: italic

        - asset: fonts/Raleway-Italic.ttf
          style: italic

        - asset: fonts/Raleway-Light.ttf
          weight: 300
        - asset: fonts/Raleway-LightItalic.ttf
          weight: 300
          style: italic

        - asset: fonts/Raleway-Medium.ttf
          weight: 500
        - asset: fonts/Raleway-MediumItalic.ttf
          weight: 500
          style: italic

        - asset: fonts/Raleway-Regular.ttf

        - asset: fonts/Raleway-SemiBold.ttf
          weight: 600
        - asset: fonts/Raleway-SemiBoldItalic.ttf
          weight: 600
          style: italic

        - asset: fonts/Raleway-Thin.ttf
          weight: 100
        - asset: fonts/Raleway-ThinItalic.ttf
          weight: 100
          style: italic

    - family: HelveticaNeue
      fonts:
        - asset: fonts/HelveticaNeue-Bold.ttf
          weight: 700
        - asset: fonts/HelveticaNeue-Italic.ttf
          style: italic
        - asset: fonts/HelveticaNeue-Light.ttf
          weight: 300
        - asset: fonts/HelveticaNeue-Medium.ttf
          weight: 500
        - asset: fonts/HelveticaNeue-Thin.ttf
          weight: 100
